<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #94a3b8;
      --paddle: #f8fafc;
      --ball: #fbbf24;
      --text: #e2e8f0;
      --score: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px;
    }

    .scoreboard {
      width: min(80vw, 800px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px 22px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(1rem, 2vw, 1.4rem);
    }

    canvas {
      display: block;
      width: min(80vw, 800px);
      height: auto;
      background: #08111d;
      border: 3px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(148, 163, 184, 0.2);
      cursor: none;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="scoreboard">
      <div>Player: <span id="playerScore">0</span></div>
      <div>Computer: <span id="computerScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const playerScoreEl = document.getElementById('playerScore');
    const computerScoreEl = document.getElementById('computerScore');

    const paddleWidth = 14;
    const paddleHeight = 100;
    const ballRadius = 8;

    let playerScore = 0;
    let computerScore = 0;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 8
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5.2
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      speedX: 5,
      speedY: 4
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updateScores() {
      playerScoreEl.textContent = playerScore;
      computerScoreEl.textContent = computerScore;
    }

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.4) - 0.7;
      const speed = 5.5;

      ball.speedX = direction * speed * Math.cos(angle);
      ball.speedY = speed * Math.sin(angle);
    }

    function update() {
      if (keys.ArrowUp) leftPaddle.y -= leftPaddle.speed;
      if (keys.ArrowDown) leftPaddle.y += leftPaddle.speed;

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);

      const paddleCenter = rightPaddle.y + rightPaddle.height / 2;
      if (paddleCenter < ball.y - 18) {
        rightPaddle.y += rightPaddle.speed;
      } else if (paddleCenter > ball.y + 18) {
        rightPaddle.y -= rightPaddle.speed;
      }

      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);

      ball.x += ball.speedX;
      ball.y += ball.speedY;

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.speedY *= -1;
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.speedY *= -1;
      }

      if (
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.x + ball.radius >= leftPaddle.x &&
        ball.y >= leftPaddle.y &&
        ball.y <= leftPaddle.y + leftPaddle.height &&
        ball.speedX < 0
      ) {
        const relativeIntersectY = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3);
        const speed = Math.hypot(ball.speedX, ball.speedY) + 0.3;

        ball.speedX = speed * Math.cos(bounceAngle);
        ball.speedY = speed * Math.sin(bounceAngle);
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius;
      }

      if (
        ball.x + ball.radius >= rightPaddle.x &&
        ball.x - ball.radius <= rightPaddle.x + rightPaddle.width &&
        ball.y >= rightPaddle.y &&
        ball.y <= rightPaddle.y + rightPaddle.height &&
        ball.speedX > 0
      ) {
        const relativeIntersectY = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3);
        const speed = Math.hypot(ball.speedX, ball.speedY) + 0.3;

        ball.speedX = -speed * Math.cos(bounceAngle);
        ball.speedY = speed * Math.sin(bounceAngle);
        ball.x = rightPaddle.x - ball.radius;
      }

      if (ball.x + ball.radius < 0) {
        computerScore++;
        updateScores();
        resetBall(1);
      }

      if (ball.x - ball.radius > canvas.width) {
        playerScore++;
        updateScores();
        resetBall(-1);
      }
    }

    function drawCenterLine() {
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.8)';
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(x, y, width, height) {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x, y, width, height);
    }

    function drawBall(x, y, radius) {
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#08111d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenterLine();
      drawPaddle(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      drawPaddle(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
      drawBall(ball.x, ball.y, ball.radius);
    }

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = event.clientY - rect.top;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        keys[event.key] = true;
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
        keys[event.key] = false;
      }
    });

    updateScores();
    resetBall(1);

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
