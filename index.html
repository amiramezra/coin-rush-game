<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b32"><title>מרוץ המטבעות</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#101b32;color:#fff;font-family:Arial,sans-serif}
main{max-width:500px;margin:auto;padding:12px;display:grid;gap:10px}h1{text-align:center;margin:5px 0;font-size:26px}
.hud{display:flex;justify-content:space-between;background:#1e2d4d;border-radius:12px;padding:11px;font-weight:bold}
canvas{display:block;width:100%;height:auto;aspect-ratio:360/540;border-radius:16px;touch-action:none;background:#8be0ff}
button{border:0;border-radius:12px;padding:14px 8px;font-weight:bold;font-size:16px;background:#facc15;color:#172033}
#start{background:#34d399}.controls{display:flex;gap:8px}.controls button{flex:1}
p{margin:0;text-align:center;color:#dbeafe;font-size:13px;line-height:1.5}
</style></head>
<body><main>
<h1>🏁 מרוץ המטבעות</h1><p>זוזו בין הנתיבים, קפצו מעל מכשולים ואספו מטבעות!</p>
<div class="hud"><span>🪙 <b id="coins">0</b></span><span>🏆 שיא <b id="best">0</b></span><span>📏 <b id="distance">0</b> מ׳</span></div>
<canvas id="game" width="360" height="540"></canvas>
<button id="start">התחל משחק</button>
<div class="controls"><button id="left">⬅ שמאלה</button><button id="jump">⬆ קפיצה</button><button id="right">ימינה ➡</button></div>
<p>אפשר גם להחליק על המסך. השיא נשמר במכשיר הזה.</p>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
let active=false,lane=1,coins=0,dist=0,speed=3,items=[],spawn=0,jump=0,last=0;
let best=0;try{best=+(localStorage.getItem('coinrushBest')||0)}catch(e){} $('best').textContent=best;
const laneX=[94,180,266];
function start(){active=true;lane=1;coins=0;dist=0;speed=3;items=[];spawn=0;jump=0;$('coins').textContent=0;$('distance').textContent=0;$('start').textContent='התחל מחדש';last=performance.now();requestAnimationFrame(step)}
function move(n){if(active)lane=Math.max(0,Math.min(2,lane+n))}
function hop(){if(active&&jump<=0)jump=22}
$('start').onclick=start;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=hop;
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')hop()});
let tx=0,ty=0;canvas.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)hop()},{passive:true});
function draw(){
ctx.clearRect(0,0,360,540);let g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#79d9ff');g.addColorStop(1,'#d9f99d');ctx.fillStyle=g;ctx.fillRect(0,0,360,540);
ctx.fillStyle='#4d9b55';ctx.fillRect(0,150,360,390);
ctx.fillStyle='#3f4657';ctx.beginPath();ctx.moveTo(45,540);ctx.lineTo(115,145);ctx.lineTo(245,145);ctx.lineTo(315,540);ctx.closePath();ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([16,17]);ctx.beginPath();ctx.moveTo(137,540);ctx.lineTo(157,145);ctx.moveTo(223,540);ctx.lineTo(203,145);ctx.stroke();ctx.setLineDash([]);
for(let i=0;i<7;i++){let y=(i*92+dist*1.5)%540;ctx.fillStyle='#28784a';ctx.beginPath();ctx.arc(23,y,14,0,7);ctx.arc(338,y+20,15,0,7);ctx.fill()}
items.forEach(it=>{ctx.textAlign='center';ctx.font='26px Arial';ctx.fillText(it.type==='coin'?'🪙':'🚧',laneX[it.lane],it.y)});
const py=438-(jump>0?Math.sin((22-jump)/22*Math.PI)*70:0);ctx.font='42px Arial';ctx.textAlign='center';ctx.fillText('🏃',laneX[lane],py);
if(!active){ctx.fillStyle='#102039dd';ctx.fillRect(35,205,290,95);ctx.fillStyle='white';ctx.font='bold 22px Arial';ctx.fillText(coins?'המשחק הסתיים!':'מוכנים למרוץ?',180,245);ctx.font='16px Arial';ctx.fillText(coins?'אספת '+coins+' מטבעות':'לחצו על ״התחל משחק״',180,275)}
}
function step(now){if(!active){draw();return}const dt=Math.min(2,(now-last)/16.67);last=now;spawn+=dt;dist+=speed*dt*.055;speed=Math.min(7,3+dist/260);
if(spawn>24/speed){spawn=0;items.push({lane:Math.floor(Math.random()*3),y:145,type:Math.random()<.68?'coin':'obstacle'})}
for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=speed*dt*1.65;if(it.lane===lane&&it.y>405&&it.y<465){if(it.type==='coin'){coins++;$('coins').textContent=coins;items.splice(i,1)}else if(jump<7){active=false;$('start').textContent='נסה שוב';if(coins>best){best=coins;$('best').textContent=best;try{localStorage.setItem('coinrushBest',best)}catch(e){}}break}else items.splice(i,1)}else if(it.y>570)items.splice(i,1)}
if(jump>0)jump=Math.max(0,jump-dt);$('distance').textContent=Math.floor(dist);draw();if(active)requestAnimationFrame(step)
}
draw();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
